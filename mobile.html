<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SG Field">
<title>SG Field</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;padding-bottom:80px}
.header{background:#1e3a5f;padding:14px 20px 12px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:700;color:#fff}
.header-right{display:flex;align-items:center;gap:10px}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#22c55e}
.badge{background:#2563eb;color:#fff;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;min-width:24px;text-align:center}
.nav{position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:1px solid #334155;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;color:#64748b;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;cursor:pointer}
.nav-btn.active{color:#3b82f6}
.nav-btn svg{width:24px;height:24px}
.page{display:none;padding:0}
.page.active{display:block}
.add-form{background:#1e293b;border-bottom:1px solid #334155;padding:16px}
.add-form h2{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
input,select,textarea{width:100%;background:#0f172a;border:1.5px solid #334155;border-radius:10px;padding:12px 14px;color:#f1f5f9;font-size:16px;outline:none;-webkit-appearance:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:#3b82f6}
textarea{resize:none;height:70px;margin-bottom:0}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.btn-blue{background:#2563eb;color:#fff;margin-top:10px}
.btn-green{background:#16a34a;color:#fff}
.contact-list{padding:12px 14px}
.contact-card{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid #334155;display:flex;align-items:center;gap:12px}
.contact-card .av{width:40px;height:40px;border-radius:50%;background:#1e3a5f;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#60a5fa;flex-shrink:0}
.contact-card .info{flex:1;min-width:0}
.contact-card .name{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact-card .co{font-size:12px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.contact-card .ph{font-size:11px;color:#94a3b8;margin-top:2px}
.del-btn{background:#7f1d1d;border:none;color:#fca5a5;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
.upload-bar{position:sticky;bottom:80px;padding:12px 14px;background:#0f172a;border-top:1px solid #1e293b}
.empty-state{text-align:center;padding:48px 24px;color:#64748b}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:14px;line-height:1.6}
.search-bar{background:#1e293b;border-bottom:1px solid #334155;padding:16px}
.search-bar h2{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.search-bar input,.search-bar select{margin-bottom:8px}
.btn-prospect{background:#7c3aed;color:#fff;margin-top:2px}
.prospect-results{padding:12px 14px}
.prospect-card{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid #334155;display:flex;gap:12px;align-items:flex-start}
.prospect-card .pav{width:40px;height:40px;border-radius:10px;background:#1e3a5f;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-top:2px}
.prospect-card .pinfo{flex:1;min-width:0}
.prospect-card .pname{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prospect-card .ptype{font-size:11px;color:#7c3aed;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.prospect-card .paddr{font-size:12px;color:#64748b;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prospect-card .pph{font-size:12px;color:#94a3b8;margin-top:2px}
.add-prospect-btn{background:#1e3a5f;border:none;color:#60a5fa;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;margin-top:2px}
.add-prospect-btn.added{background:#15803d;color:#bbf7d0}
.loading{text-align:center;padding:40px;color:#64748b;font-size:14px}
.spinner{width:32px;height:32px;border:3px solid #334155;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 22px;border-radius:20px;font-weight:600;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.no-results{text-align:center;padding:36px 24px;color:#64748b;font-size:14px;line-height:1.6}
</style></head><body>
<div class="header"><h1>SG Field</h1><div class="header-right"><span class="badge" id="list-badge" style="display:none">0</span><div class="sync-dot" id="sdot"></div></div></div>
<div class="toast" id="toast"></div>
<div class="page active" id="page-list">
<div class="add-form"><h2>New Contact</h2>
<div class="form-row"><input type="text" id="c-first" placeholder="First Name"><input type="text" id="c-last" placeholder="Last Name"></div>
<input type="text" id="c-co" placeholder="Company *" style="margin-bottom:8px">
<input type="text" id="c-title" placeholder="Title / Role" style="margin-bottom:8px">
<input type="tel" id="c-phone" placeholder="Phone" style="margin-bottom:8px">
<input type="text" id="c-city" placeholder="City / Location" style="margin-bottom:8px">
<textarea id="c-notes" placeholder="Notes (optional)"></textarea>
<button class="btn btn-blue" onclick="addToList()">+ Add to List</button></div>
<div class="contact-list" id="contact-list-area"><div class="empty-state"><div class="icon">&#128203;</div><p>Your list is empty.<br>Add contacts above and upload<br>them all at the end of the day.</p></div></div>
<div class="upload-bar" id="upload-bar" style="display:none"><button class="btn btn-green" id="upload-btn" onclick="uploadAll()">Upload Contacts to Dashboard</button></div>
</div>
<div class="page" id="page-prospect">
<div class="search-bar"><h2>Prospect Finder</h2>
<input type="text" id="p-city" placeholder="City (e.g. Flint, MI)">
<select id="p-industry"><option value="all">All Industries</option><option value="cosmetics">Cosmetics / Beauty</option><option value="fitness">Fitness / Sports</option><option value="food">Food and Beverage</option><option value="retail">Retail / Boutique</option><option value="health">Health / Wellness</option><option value="manufacturing">Manufacturing / Industrial</option></select>
<button class="btn btn-prospect" onclick="findProspects()">Find Prospects</button></div>
<div class="prospect-results" id="prospect-results"><div class="no-results" style="color:#475569">Enter a city above to find prospects.</div></div>
</div>
<nav class="nav">
<button class="nav-btn active" onclick="nav('list',this)"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>My List</button>
<button class="nav-btn" onclick="nav('prospect',this)"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>Prospect</button>
</nav>
<script>
const SB='https://zacyaawllbzqlhzlmfll.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphY3lhYXdsbGJ6cWxoemxtZmxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODYxMTQsImV4cCI6MjA5NDE2MjExNH0.D-ORaVoHs4So4NK-WLecEJIB-SlIdnmG9Z-yjLG-33k';
let dayList=[],existingContacts=[];
async function sbSet(k,v){try{await fetch(SB+'/rest/v1/sg_data',{method:'POST',headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify({key:k,value:v,updated_at:new Date().toISOString()})});dot(1);}catch(e){dot(0);}}
function dot(ok){document.getElementById('sdot').style.background=ok?'#22c55e':'#ef4444';}
function toast(m,c){const t=document.getElementById('toast');t.textContent=m;t.style.background=c||'#16a34a';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
async function init(){try{const r=await fetch(SB+'/rest/v1/sg_data?key=eq.contacts&select=value',{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});const d=await r.json();if(d.length&&Array.isArray(d[0].value))existingContacts=d[0].value;dot(1);}catch(e){dot(0);}}
function nav(name,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById('page-'+name).classList.add('active');btn.classList.add('active');}
function addToList(){const first=document.getElementById('c-first').value.trim();const last=document.getElementById('c-last').value.trim();const co=document.getElementById('c-co').value.trim();if(!co&&!first){toast('Need at least a company or name','#dc2626');return;}const contact={_lid:Date.now()+Math.random(),name:(first+' '+last).trim()||'',company:co,title:document.getElementById('c-title').value.trim(),phone:document.getElementById('c-phone').value.trim(),city:document.getElementById('c-city').value.trim(),notes:document.getElementById('c-notes').value.trim(),addedAt:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})};dayList.push(contact);['c-first','c-last','c-co','c-title','c-phone','c-city','c-notes'].forEach(id=>document.getElementById(id).value='');document.getElementById('c-first').focus();renderList();toast('Added: '+(contact.name||contact.company));}
function removeFromList(lid){dayList=dayList.filter(c=>c._lid!==lid);renderList();}
function renderList(){const el=document.getElementById('contact-list-area');const bar=document.getElementById('upload-bar');const badge=document.getElementById('list-badge');const upBtn=document.getElementById('upload-btn');if(!dayList.length){el.innerHTML='<div class="empty-state"><div class="icon">&#128203;</div><p>Your list is empty.<br>Add contacts above and upload<br>them all at the end of the day.</p></div>';bar.style.display='none';badge.style.display='none';return;}badge.textContent=dayList.length;badge.style.display='inline-block';upBtn.textContent='Upload '+dayList.length+' Contact'+(dayList.length!==1?'s':'')+' to Dashboard';bar.style.display='block';el.innerHTML=dayList.map(c=>{const ini=((c.name||c.company||'?').split(' ').map(w=>w[0]||'').join('').substring(0,2)||'?').toUpperCase();return '<div class="contact-card"><div class="av">'+ini+'</div><div class="info"><div class="name">'+(c.name||'&mdash;')+'</div><div class="co">'+(c.company||'&mdash;')+'</div>'+(c.phone?'<div class="ph">'+c.phone+'</div>':'')+'<div class="ph">Added '+c.addedAt+(c.city?' - '+c.city:'')+'</div></div><button class="del-btn" onclick="removeFromList('+c._lid+')">X</button></div>';}).join('');}
async function uploadAll(){if(!dayList.length)return;const btn=document.getElementById('upload-btn');btn.textContent='Uploading...';btn.disabled=true;const ts=new Date().toISOString();const newContacts=dayList.map(c=>({id:'f'+Date.now()+Math.floor(Math.random()*99999),name:c.name,company:c.company,title:c.title||'',phone:c.phone||'',email:'',city:c.city||'',notes:c.notes||'',status:'cold',lastContact:ts,source:'mobile_field'}));const merged=newContacts.concat(existingContacts);await sbSet('contacts',merged);existingContacts=merged;const n=dayList.length;dayList=[];renderList();toast(n+' contact'+(n!==1?'s':'')+' added to dashboard!');btn.disabled=false;}
const IC={all:{l:'Business',e:'&#127970;',t:[['shop'],['office','company'],['craft']]},cosmetics:{l:'Cosmetics',e:'&#128132;',t:[['shop','cosmetics'],['shop','beauty'],['shop','hairdresser'],['craft','beauty_salon']]},fitness:{l:'Fitness',e:'&#128170;',t:[['leisure','fitness_centre'],['amenity','gym'],['shop','sports']]},food:{l:'Food',e:'&#127869;',t:[['shop','deli'],['shop','beverages'],['shop','bakery'],['amenity','restaurant']]},retail:{l:'Retail',e:'&#128717;',t:[['shop','clothes'],['shop','gift'],['shop','jewelry']]},health:{l:'Health',e:'&#128138;',t:[['amenity','pharmacy'],['amenity','clinic'],['shop','health_food'],['amenity','spa']]},manufacturing:{l:'Manufacturing',e:'&#127981;',t:[['man_made','works'],['office','manufacturer']]}};
async function findProspects(){const city=document.getElementById('p-city').value.trim();const industry=document.getElementById('p-industry').value;if(!city){toast('Enter a city first','#dc2626');return;}const el=document.getElementById('prospect-results');el.innerHTML='<div class="loading"><div class="spinner"></div>Looking for prospects in '+city+'...</div>';try{const geoRes=await fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(city)+'&format=json&limit=1',{headers:{'User-Agent':'SGFieldApp/1.0'}});const geoData=await geoRes.json();if(!geoData.length){el.innerHTML='<div class="no-results">City not found. Try adding state (e.g. Flint, MI).</div>';return;}const lat=parseFloat(geoData[0].lat);const lon=parseFloat(geoData[0].lon);const d=0.08;const bbox=lat-d+','+(lon-d)+','+(lat+d)+','+(lon+d);const cfg=IC[industry]||IC.all;const tf=cfg.t.map(t=>t.length===1?'node["'+t[0]+'"]('+bbox+');':'node["'+t[0]+'"="'+t[1]+'"]('+bbox+');').join('
');const q='[out:json][timeout:25];
(
'+tf+'
);
out body 30;';const ovRes=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:q});const ovData=await ovRes.json();const elements=(ovData.elements||[]).filter(e=>e.tags&&e.tags.name).slice(0,25);if(!elements.length){el.innerHTML='<div class="no-results">No results in '+city+'. Try a broader industry or nearby city.</div>';return;}window._pr=elements.map(e=>{const t=e.tags||{};return{name:t.name,addr:[t['addr:housenumber'],t['addr:street'],t['addr:city']].filter(Boolean).join(' '),phone:t.phone||t['contact:phone']||'',type:(t.shop||t.leisure||t.amenity||t.craft||t.office||cfg.l).replace(/_/g,' ')};});el.innerHTML='<div style="font-size:12px;color:#64748b;padding:8px 2px 4px;font-weight:600">'+elements.length+' PROSPECTS - '+city.toUpperCase()+'</div>'+window._pr.map((p,i)=>'<div class="prospect-card"><div class="pav">'+cfg.e+'</div><div class="pinfo"><div class="pname">'+p.name+'</div><div class="ptype">'+p.type+'</div>'+(p.addr?'<div class="paddr">'+p.addr+'</div>':'')+(p.phone?'<div class="pph">'+p.phone+'</div>':'')+'</div><button class="add-prospect-btn" id="padd-'+i+'" onclick="addPL('+i+')">Add</button></div>').join('');}catch(e){el.innerHTML='<div class="no-results">Search failed - check connection.</div>';}}
function addPL(i){const btn=document.getElementById('padd-'+i);if(btn.classList.contains('added'))return;const p=window._pr[i];dayList.push({_lid:Date.now()+Math.random(),name:'',company:p.name,title:p.type,phone:p.phone,city:p.addr,notes:'',addedAt:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})});btn.textContent='Added';btn.classList.add('added');renderList();toast('Added: '+p.name);}
init();
</script></body></html>
