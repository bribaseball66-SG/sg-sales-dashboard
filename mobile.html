.header h1{font-size:18px;font-weight:700;color:#fff}
.header-right{display:flex;align-items:center;gap:10px}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#22c55e}
.badge{background:#2563eb;color:#fff;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;min-width:24px;text-align:center}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:1px solid #334155;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;color:#64748b;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;cursor:pointer}
.nav-btn.active{color:#3b82f6}
.nav-btn svg{width:24px;height:24px}
.page{display:none;padding:0}
.page.active{display:block}

/* --- CONTACT LIST --- */
.add-form{background:#1e293b;border-bottom:1px solid #334155;padding:16px}
.add-form h2{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
input,select,textarea{width:100%;background:#0f172a;border:1.5px solid #334155;border-radius:10px;padding:12px 14px;color:#f1f5f9;font-size:16px;outline:none;-webkit-appearance:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:#3b82f6}
textarea{resize:none;height:70px;margin-bottom:0}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.btn-blue{background:#2563eb;color:#fff;margin-top:10px}
.btn-green{background:#16a34a;color:#fff}
.btn-disabled{background:#1e293b;color:#475569;border:1.5px solid #334155}
.contact-list{padding:12px 14px}
.contact-card{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid #334155;display:flex;align-items:center;gap:12px}
.contact-card .av{width:40px;height:40px;border-radius:50%;background:#1e3a5f;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#60a5fa;flex-shrink:0}
.contact-card .info{flex:1;min-width:0}
.contact-card .name{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact-card .co{font-size:12px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.contact-card .ph{font-size:11px;color:#94a3b8;margin-top:2px}
.del-btn{background:#7f1d1d;border:none;color:#fca5a5;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
.upload-bar{position:sticky;bottom:80px;padding:12px 14px;background:#0f172a;border-top:1px solid #1e293b}
.empty-state{text-align:center;padding:48px 24px;color:#64748b}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:14px;line-height:1.6}

/* --- PROSPECT --- */
.search-bar{background:#1e293b;border-bottom:1px solid #334155;padding:16px}
.search-bar h2{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.search-bar input{margin-bottom:8px}
.search-bar select{margin-bottom:8px}
.btn-prospect{background:#7c3aed;color:#fff;margin-top:2px}
.prospect-results{padding:12px 14px}
.prospect-card{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid #334155;display:flex;gap:12px;align-items:flex-start}
.prospect-card .pav{width:40px;height:40px;border-radius:10px;background:#1e3a5f;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-top:2px}
.prospect-card .pinfo{flex:1;min-width:0}
.prospect-card .pname{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prospect-card .ptype{font-size:11px;color:#7c3aed;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.prospect-card .paddr{font-size:12px;color:#64748b;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prospect-card .pph{font-size:12px;color:#94a3b8;margin-top:2px}
.add-prospect-btn{background:#1e3a5f;border:none;color:#60a5fa;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;margin-top:2px}
.add-prospect-btn.added{background:#15803d;color:#bbf7d0}
.loading{text-align:center;padding:40px;color:#64748b;font-size:14px}
.spinner{width:32px;height:32px;border:3px solid #334155;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 22px;border-radius:20px;font-weight:600;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.no-results{text-align:center;padding:36px 24px;color:#64748b;font-size:14px;line-height:1.6}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:12px;font-weight:600;background:#1e3a5f;color:#60a5fa;margin-top:4px}

</div>

<!-- PROSPECT FINDER TAB -->
<div class="page" id="page-prospect">

      <option value="manufacturing">Manufacturing / Industrial</option>
    </select>
    <button class="btn btn-prospect" onclick="window.findProspects()">Find Prospects</button>
  </div>
  <div class="prospect-results" id="prospect-results">

  </div>
</div>

var dayList=[];
window._SGP=[];

function sbHeaders(){
  return {'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json'};
}

function fetchWithTimeout(url,opts,ms){
  var ctrl=new AbortController();
  var timer=setTimeout(function(){ctrl.abort();},ms||15000);
  return fetch(url,Object.assign({},opts,{signal:ctrl.signal})).finally(function(){clearTimeout(timer);});
}

/* Contacts now live in the Supabase `contacts` TABLE (one row per contact,
   jsonb in `data`). Row-level upserts mean the phone can never clobber the
   desktop's data with a stale whole-array write. */
function fetchContacts(){
  return fetch(SB+'/rest/v1/contacts?select=data&order=updated_at.asc',{headers:sbHeaders()})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(rows){return rows.map(function(x){return x.data;}).filter(Boolean);});
}

function sbUpsertContacts(list){
  var now=new Date().toISOString();
  var body=list.filter(function(c){return c&&c.id;}).map(function(c){return {id:String(c.id),data:c,updated_at:now};});
  if(!body.length) return Promise.resolve();
  return fetch(SB+'/rest/v1/contacts?on_conflict=id',{
    method:'POST',
    headers:Object.assign({},sbHeaders(),{'Prefer':'resolution=merge-duplicates'}),
    body:JSON.stringify(body)
  })
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);dot(1);})
  .catch(function(e){dot(0);throw e;});
}

function dot(ok){
  var el=document.getElementById('sdot');
  if(el) el.style.background=ok?'#22c55e':'#ef4444';
}

function toast(m,color){
  var t=document.getElementById('toast');
  if(!t) return;
  t.textContent=m;
  t.style.background=color||'#16a34a';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}

function needsRestore(contacts){
  if(!contacts||contacts.length<5) return true;
  var bad=contacts.filter(function(c){return !c.name||c.name==='undefined'||c.name==='null';});
  return bad.length>0;
}

function init(){
  fetchContacts().then(function(contacts){
    if(needsRestore(contacts)){
      /* Auto-restore from HubSpot backup — row upserts, never overwrites others */
      sbUpsertContacts(HS_BACKUP).then(function(){
        dot(1);
        toast('Contacts restored ('+HS_BACKUP.length+')', '#2563eb');
      }).catch(function(){dot(0);});
    } else {
      dot(1);
    }
  }).catch(function(){dot(0);});
}

window.goTo=function(name,btn){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  var pg=document.getElementById('page-'+name);
  if(pg)pg.classList.add('active');
  if(btn)btn.classList.add('active');
};

window.addToList=function(){
  var first=document.getElementById('c-first').value.trim();
  var last=document.getElementById('c-last').value.trim();
  var co=document.getElementById('c-co').value.trim();
  if(!co&&!first){toast('Need at least a company or name','#dc2626');return;}
  var contact={
    _lid:Date.now()+Math.random(),
    name:(first+' '+last).trim()||'',
    company:co,
    title:document.getElementById('c-title').value.trim(),
    phone:document.getElementById('c-phone').value.trim(),
    city:document.getElementById('c-city').value.trim(),
    notes:document.getElementById('c-notes').value.trim(),
    addedAt:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})
  };
  dayList.push(contact);
  ['c-first','c-last','c-co','c-title','c-phone','c-city','c-notes'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('c-first').focus();
  renderList();
  toast('Added: '+(contact.name||contact.company));
};

window.removeFromList=function(lid){
  dayList=dayList.filter(function(c){return c._lid!==lid;});
  renderList();
};

function renderList(){
  var el=document.getElementById('contact-list-area');
  var bar=document.getElementById('upload-bar');
  var badge=document.getElementById('list-badge');
  var upBtn=document.getElementById('upload-btn');
  if(!el) return;
  if(!dayList.length){
    el.innerHTML='<div class="empty-state"><div class="icon">&#128203;</div><p>Your list is empty.<br>Add contacts above and upload<br>them all at the end of the day.</p></div>';
    if(bar) bar.style.display='none';
    if(badge) badge.style.display='none';
    return;
  }
  if(badge){badge.textContent=dayList.length;badge.style.display='inline-block';}
  if(upBtn) upBtn.textContent='Upload '+dayList.length+' Contact'+(dayList.length!==1?'s':'')+' to Dashboard';
  if(bar) bar.style.display='block';
  el.innerHTML=dayList.map(function(c){
    var ini=((c.name||c.company||'?').split(' ').map(function(w){return w[0]||'';}).join('').substring(0,2)||'?').toUpperCase();
    return '<div class="contact-card">'
      +'<div class="av">'+ini+'</div>'
      +'<div class="info">'
      +'<div class="name">'+(c.name||'&mdash;')+'</div>'
      +'<div class="co">'+(c.company||'&mdash;')+'</div>'
      +(c.phone?'<div class="ph">'+c.phone+'</div>':'')
      +(c.addedAt?'<div class="ph">Added '+c.addedAt+(c.city?' &middot; '+c.city:'')+'</div>':'')
      +'</div>'
      +'<button class="del-btn" onclick="window.removeFromList('+c._lid+')">X</button>'
      +'</div>';
  }).join('');
}

window.uploadAll=function(){
  if(!dayList.length) return;
  var btn=document.getElementById('upload-btn');
  if(btn){btn.textContent='Uploading...';btn.disabled=true;}
  var ts=new Date().toISOString();
  var snapshot=dayList.slice();
  var newContacts=snapshot.map(function(c){
    return {
      id:'f'+Date.now()+Math.floor(Math.random()*99999),
      name:(c.name||c.company||'').trim()||'Unknown',
      company:c.company||'',
      title:c.title||'',
      phone:c.phone||'',
      email:'',
      city:c.city||'',
      notes:c.notes||'',
      status:'cold',
      priority:'cold',
      lastContact:ts.split('T')[0],
      source:'mobile_field',
      addedAt:ts
    };
  });
  /* Row-level upsert — no merge needed, can't clobber other devices */
  sbUpsertContacts(newContacts).then(function(){
    var n=snapshot.length;
    dayList=[];
    renderList();
    toast(n+' contact'+(n!==1?'s':'')+' added to dashboard!');
    if(btn){btn.textContent='Upload Contacts to Dashboard';btn.disabled=false;}
  }).catch(function(){
    toast('Upload failed — check connection','#dc2626');
    if(btn){btn.textContent='Retry Upload';btn.disabled=false;}
  });
};

var industryConfig={
  all:{label:'Business',emoji:'🏢',tags:[['shop'],['office','company'],['office','manufacturer'],['amenity','bank'],['craft']]},
  cosmetics:{label:'Cosmetics / Beauty',emoji:'💄',tags:[['shop','cosmetics'],['shop','beauty'],['shop','hairdresser'],['craft','beauty_salon'],['shop','perfumery']]},
  fitness:{label:'Fitness / Sports',emoji:'💪',tags:[['leisure','fitness_centre'],['leisure','sports_centre'],['amenity','gym'],['shop','sports']]},
  food:{label:'Food & Beverage',emoji:'🍽️',tags:[['shop','deli'],['shop','beverages'],['shop','bakery'],['amenity','restaurant'],['shop','supermarket']]},
  retail:{label:'Retail',emoji:'🛍️',tags:[['shop','clothes'],['shop','boutique'],['shop','gift'],['shop','jewelry'],['shop','department_store']]},
  health:{label:'Health / Wellness',emoji:'💊',tags:[['amenity','pharmacy'],['amenity','clinic'],['shop','health_food'],['shop','herbalist'],['amenity','spa']]},
  manufacturing:{label:'Manufacturing',emoji:'🏭',tags:[['man_made','works'],['industrial','factory'],['building','industrial'],['office','manufacturer']]}
};

window.findProspects=function(){
  var city=document.getElementById('p-city').value.trim();
  var industry=document.getElementById('p-industry').value;
  if(!city){toast('Enter a city first','#dc2626');return;}
  var el=document.getElementById('prospect-results');
  el.innerHTML='<div class="loading"><div class="spinner"></div>Looking for prospects in '+city+'...</div>';
  window._SGP=[];

  /* No User-Agent header — forbidden in browsers, breaks mobile Safari */
  fetchWithTimeout('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(city),{},12000)
    .then(function(r){return r.json();})
    .then(function(geo){
      if(!geo.length){el.innerHTML='<div class="no-results">City not found. Try adding state (e.g. "Flint, MI").</div>';return;}
      var lat=parseFloat(geo[0].lat),lon=parseFloat(geo[0].lon),d=0.08;
      var bbox=(lat-d)+','+(lon-d)+','+(lat+d)+','+(lon+d);
      var cfg=industryConfig[industry]||industryConfig.all;
      var filters=cfg.tags.map(function(t){
        return t.length===1?'node["'+t[0]+'"]('+bbox+');':
          'node["'+t[0]+'"="'+t[1]+'"]('+bbox+');';
      }).join('\n');
      var q='[out:json][timeout:25];\n(\n'+filters+'\n);\nout body 30;';
      return fetchWithTimeout('https://overpass-api.de/api/interpreter',{method:'POST',body:q},25000)
        .then(function(r){return r.json();})
        .then(function(ov){
          var items=(ov.elements||[]).filter(function(e){return e.tags&&e.tags.name;}).slice(0,25);
          if(!items.length){
            el.innerHTML='<div class="no-results">No results in '+city+' for that category.<br>Try a broader industry or nearby city.</div>';
            return;
          }
          window._SGP=items;
          renderProspects(items,cfg,city);
        });
    })
    .catch(function(e){
      el.innerHTML='<div class="no-results">Search failed — check your connection and try again.</div>';
    });
};

function renderProspects(items,cfg,city){
  var el=document.getElementById('prospect-results');
  el.innerHTML='<div style="font-size:12px;color:#64748b;padding:8px 2px 4px;font-weight:600">'+items.length+' PROSPECTS FOUND &middot; '+city.toUpperCase()+'</div>'+
    items.map(function(e,i){
      var t=e.tags||{};
      var name=t.name||'Unknown';
      var addr=[t['addr:housenumber'],t['addr:street'],t['addr:city']].filter(Boolean).join(' ');
      var phone=t.phone||t['contact:phone']||'';
      var type=(t.shop||t.leisure||t.amenity||t.craft||t.office||t.industrial||cfg.label).replace(/_/g,' ');
      return '<div class="prospect-card">'
        +'<div class="pav">'+cfg.emoji+'</div>'
        +'<div class="pinfo">'
        +'<div class="pname">'+name+'</div>'
        +'<div class="ptype">'+type+'</div>'
        +(addr?'<div class="paddr">'+addr+'</div>':'')
        +(phone?'<div class="pph">'+phone+'</div>':'')
        +'</div>'
        +'<button class="add-prospect-btn" id="padd-'+i+'" onclick="window.addProspectToList('+i+')">+ Add</button>'
        +'</div>';
    }).join('');
}

window.addProspectToList=function(i){
  var p=window._SGP[i];
  if(!p) return;
  var btn=document.getElementById('padd-'+i);
  if(!btn||btn.classList.contains('added')) return;
  var t=p.tags||{};
  var name=t.name||'Unknown';
  var addr=[t['addr:housenumber'],t['addr:street'],t['addr:city']].filter(Boolean).join(' ');
  var phone=t.phone||t['contact:phone']||'';
  var type=(t.shop||t.leisure||t.amenity||t.craft||t.office||t.industrial||'Business').replace(/_/g,' ');
  dayList.push({
    _lid:Date.now()+Math.random(),
    name:'',
    company:name,
    title:type,
    phone:phone,
    city:addr,
    notes:'',
    addedAt:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})
  });
  btn.textContent='Added';
  btn.classList.add('added');
  renderList();
  toast('Added: '+name);
};

init();
})();
